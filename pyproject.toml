[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elastic-harness"
version = "0.1.0"
description = "A Claude Code-style terminal harness for Elastic Agent Builder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13", "prompt_toolkit>=3"]

[project.scripts]
eh = "elastic_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
